# CI for every push to main and every pull request: run the fast pre-commit
# checks, then the heavy build/eval gates. Both are the SAME hooks/scripts a
# developer runs locally (.pre-commit-config.yaml) — CI just enforces them for
# PRs where the author may not have installed the hooks. eval is not build;
# the gate job builds. See AGENTS.md, "eval is NOT build".
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, daemon-free checks — the pre-commit stage of .pre-commit-config.yaml,
  # run through pre-commit itself so CI and the local hook can't drift.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Pre-commit checks (nixfmt, shellcheck, gitleaks, check-*.py)
        run: nix develop -c pre-commit run --all-files --show-diff-on-failure --hook-stage pre-commit

  # The heavy gates — the pre-push stage — from the same scripts the hook and
  # release.yml use. A full example-host build; eval-of-every-bundle; every
  # command app evaluates.
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build example host (install-equivalent)
        run: ./utils/check-example-builds.sh

      - name: Eval example host with all non-opt-in bundles
        run: ./utils/check-bundle-eval.sh

      - name: Eval every command app
        run: ./utils/check-commands-eval.sh
