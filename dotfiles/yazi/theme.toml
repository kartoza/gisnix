[filetype]
rules = [
    # Directories - kartoza blue, bold
    { url = "*/", fg = "#569FC6", bold = true },

    # Nix files - kartoza blue, highlighted
    { url = "*.nix", fg = "#569FC6", bold = true },

    # Images - kartoza teal
    { url = "*.{jpg,jpeg,png,gif,bmp,webp,tiff,tif,ico}", fg = "#06969A", bold = true },
    { url = "*.svg", fg = "#06969A" },

    # Videos - kartoza yellow/orange
    { url = "*.{mp4,mkv,avi,mov,wmv,flv,webm,m4v,3gp}", fg = "#DF9E2F", bold = true },

    # Audio - lighter orange
    { url = "*.{mp3,flac,ogg,wav,aac,m4a,wma}", fg = "#e67e22" },

    # Archives - muted orange
    { url = "*.{zip,tar,gz,rar,7z,xz,bz2,zst,deb,rpm}", fg = "#e67e22", italic = true },

    # Documents - kartoza alert red
    { url = "*.{pdf,doc,docx,xls,xlsx,ppt,pptx,odt,ods,odp}", fg = "#CC0403" },
    { url = "*.{txt,md,rst}", fg = "#e0e0e0" },

    # Code - teal variants
    { url = "*.{py,js,ts,jsx,tsx,html,css,scss,json,xml,yaml,yml,toml,ini,conf}", fg = "#06969A" },
    { url = "*.{sh,bash,zsh,fish}", fg = "#27ae60", bold = true },
    { url = "*.{rs,go,c,cpp,h,hpp,java,kt,swift}", fg = "#16a085" },
    { url = "*.{sql,graphql}", fg = "#9a6ac7" },

    # Config and dotfiles - kartoza grey
    { url = ".*", fg = "#8A8B8B" },
    { url = "*.lock", fg = "#8A8B8B", italic = true },

    # Special files - kartoza yellow/orange accent
    { url = "*README*", fg = "#DF9E2F", bold = true },
    { url = "*LICENSE*", fg = "#DF9E2F" },
    { url = "*Makefile", fg = "#DF9E2F" },
    { url = "*flake.nix", fg = "#DF9E2F", bold = true },
    { url = "*flake.lock", fg = "#8A8B8B", italic = true },

    # Logs and temp - muted
    { url = "*.log", fg = "#8A8B8B", italic = true },
    { url = "*.tmp", fg = "#8A8B8B", italic = true },
    { url = "*.bak", fg = "#8A8B8B", italic = true },
]
