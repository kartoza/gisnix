# Kartoza theme for yazi - Official Kartoza Color Palette
# Colors:
#   highlight1 = "#DF9E2F" (yellow/orange - primary accent)
#   highlight2 = "#569FC6" (blue - secondary accent)
#   highlight3 = "#8A8B8B" (grey)
#   highlight4 = "#06969A" (teal)
#   alert      = "#CC0403" (red)
#   base00     = "#1a1a1a" (background)
#   base01     = "#2d2d2d" (lighter background)
#   base02     = "#3d3d3d" (selection)

[mgr]
cwd = { fg = "#569FC6", bold = true }
hovered = { fg = "#1a1a1a", bg = "#06969A", bold = true }
preview_hovered = { underline = true }
find_keyword = { fg = "#1a1a1a", bg = "#DF9E2F", bold = true }
find_position = { fg = "#DF9E2F", bg = "reset", italic = true }
marker_copied = { fg = "#06969A", bg = "#06969A" }
marker_cut = { fg = "#CC0403", bg = "#CC0403" }
marker_marked = { fg = "#DF9E2F", bg = "#DF9E2F" }
marker_selected = { fg = "#569FC6", bg = "#569FC6" }
tab_active = { fg = "#1a1a1a", bg = "#569FC6", bold = true }
tab_inactive = { fg = "#8A8B8B", bg = "#2d2d2d" }
# tab_width removed: yazi 25+ no longer accepts a plain integer here.
count_copied = { fg = "#1a1a1a", bg = "#06969A" }
count_cut = { fg = "#1a1a1a", bg = "#CC0403" }
count_selected = { fg = "#1a1a1a", bg = "#569FC6" }
border_symbol = "│"
border_style = { fg = "#3d3d3d" }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#569FC6", bg = "#06969A" }
mode_normal = { fg = "#1a1a1a", bg = "#569FC6", bold = true }
mode_select = { fg = "#1a1a1a", bg = "#DF9E2F", bold = true }
mode_unset = { fg = "#1a1a1a", bg = "#8A8B8B", bold = true }
progress_label = { fg = "#1a1a1a", bg = "#06969A", bold = true }
progress_normal = { fg = "#06969A", bg = "#2d2d2d" }
progress_error = { fg = "#CC0403", bg = "#2d2d2d" }
permissions_t = { fg = "#1a1a1a", bg = "#06969A" }
permissions_r = { fg = "#1a1a1a", bg = "#DF9E2F" }
permissions_w = { fg = "#1a1a1a", bg = "#CC0403" }
permissions_x = { fg = "#1a1a1a", bg = "#569FC6" }
permissions_s = { fg = "#1a1a1a", bg = "#8A8B8B" }

[select]
border = { fg = "#569FC6" }
active = { fg = "#1a1a1a", bg = "#569FC6", bold = true }
inactive = { fg = "#e0e0e0", bg = "#2d2d2d" }

[input]
border = { fg = "#569FC6" }
title = { fg = "#569FC6", bold = true }
value = { fg = "#e0e0e0" }
selected = { fg = "#1a1a1a", bg = "#06969A" }

[completion]
border = { fg = "#569FC6" }
active = { fg = "#1a1a1a", bg = "#569FC6", bold = true }
inactive = { fg = "#e0e0e0", bg = "#2d2d2d" }
icon_file = ""
icon_folder = ""
icon_command = ""

[tasks]
border = { fg = "#569FC6" }
title = { fg = "#569FC6", bold = true }
hovered = { fg = "#1a1a1a", bg = "#06969A" }

[which]
mask = { bg = "#1a1a1a" }
cand = { fg = "#06969A", bold = true }
rest = { fg = "#8A8B8B" }
desc = { fg = "#e0e0e0" }
separator = "  "
separator_style = { fg = "#3d3d3d" }

[help]
on = { fg = "#06969A", bold = true }
run = { fg = "#569FC6" }
desc = { fg = "#8A8B8B" }
hovered = { fg = "#1a1a1a", bg = "#06969A", bold = true }
footer = { fg = "#569FC6", bg = "#1a1a1a" }

[notify]
title_info = { fg = "#569FC6", bold = true }
title_warn = { fg = "#DF9E2F", bold = true }
title_error = { fg = "#CC0403", bold = true }

# File icons (requires Nerd Font)
[icon]
prepend_rules = [
