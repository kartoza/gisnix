format = """
\
$os\
$username\
[](fg:#589632 bg:#93B022)\
$directory\
[](fg:#93B022 bg:#395c6b)\
$git_branch\
$git_status\
[](fg:#395c6b bg:#55828b)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
[](fg:#55828b bg:#93B023)\
$docker_context\
[](fg:#93B023 bg:#93B023)\
$time\
[](fg:#93B023)\
$line_break\
[ │](#93B023)
$character\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:#589632"
style_root = "bg:#ee7913"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system

[directory]
style = "bg:#93B022"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = "  "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important  " = "  "

[c]
symbol = " "
style = "bg:#55828b"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#06969A" # Kartoza highlight4
format = '[ $symbol $context ]($style) $path'

[elixir]
symbol = " "
style = "bg:#55828b"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#55828b"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#395c6b"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#395c6b"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#55828b"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#55828b"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#55828b"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#55828b"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#55828b"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = " "
style = "bg:#55828b"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#55828b"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#55828b"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#93B023"
format = '[ ♥ $time ]($style)'

[character]
success_symbol = "[ ╰➤ ](#93B023)"
error_symbol = "[ ╰➤ ](bold red)"
