# Kartoza Kitty Terminal Configuration
# Brand colors:
#   highlight1 = #DF9E2F (yellow/orange - primary accent)
#   highlight2 = #569FC6 (blue - secondary accent)
#   highlight3 = #8A8B8B (grey)
#   highlight4 = #06969A (teal)
#   alert      = #CC0403 (red)

# Shell integration is sourced and configured manually
shell_integration no-rc

# Window settings
background_opacity 0.95
hide_window_decorations no
scrollback_lines 10000
window_padding_width 0
placement_strategy top-left

# Subtle Kartoza watermark background
background_image /etc/xdg/kitty/kartoza-watermark.png
background_image_layout cscaled
background_tint 0.85

# Font
font_size 18
font_family JetBrains Mono

# Cursor - Kartoza primary accent
cursor #DF9E2F
cursor_text_color #0D181E

# Cursor trail (smear cursor effect)
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Colors - dark theme with Kartoza accents
foreground #C3C7D1
background #0D181E
selection_foreground #C3C7D1
selection_background #4f5b66
url_color #569FC6
active_border_color #569FC6
inactive_border_color #8A8B8B

# Tab bar - custom Kartoza powerline (drawn by tab_bar.py)
tab_bar_edge bottom
tab_bar_style custom
tab_powerline_style angled
tab_bar_align left
tab_bar_min_tabs 1
tab_bar_margin_width 0.0
tab_bar_margin_height 2.5 1.5
tab_bar_margin_color #0D181E
tab_bar_background #0D181E
active_tab_background #CC0403
active_tab_foreground #C3C7D1
active_tab_font_style bold
inactive_tab_foreground #C3C7D1
inactive_tab_background #8A8B8B
inactive_tab_font_style normal

# Notification bell and activity icons
tab_activity_symbol 🔔

# Tab title templates (used by custom tab_bar.py)
tab_title_template "{title}"
active_tab_title_template "{title}"

# Notify on long-running command completion
notify_on_cmd_finish invisible 10.0

# Color palette - Kartoza branded
color0  #0D181E
color1  #CC0403
color2  #06969A
color3  #DF9E2F
color4  #569FC6
color5  #9a6ac7
color6  #06969A
color7  #C3C7D1
color8  #8A8B8B
color9  #CC0403
color10 #06969A
color11 #DF9E2F
color12 #569FC6
color13 #9a6ac7
color14 #569FC6
color15 #e0e0e0

# Keyboard shortcuts
map ctrl+shift+f toggle_maximized
