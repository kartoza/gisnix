<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="353px" preserveAspectRatio="none" style="width:715px;height:353px;background:#FFFFFF;" version="1.1" viewBox="0 0 715 353" width="715px" zoomAndPan="magnify"><?plantuml 1.2026.3?><defs/><g><g class="title" data-source-line="3"><text fill="#383939" font-family="Ubuntu" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="475.6634" x="118.7483" y="38.5181">Building a fleet of your own on top of gisnix</text></g><!--cluster gisnix--><g class="cluster" data-qualified-name="gisnix" data-source-line="5" id="ent0002"><path d="M456.16,67.0961 L491.3829,67.0961 A9,9 0 0 1 497.3829,73.0961 L504.3829,92.164 L694.16,92.164 A6,6 0 0 1 700.16,98.164 L700.16,323.4961 A6,6 0 0 1 694.16,329.4961 L456.16,329.4961 A6,6 0 0 1 450.16,323.4961 L450.16,73.0961 A6,6 0 0 1 456.16,67.0961" fill="#FFFFFF" style="stroke:#8A8B8B;stroke-width:1;"/><line style="stroke:#8A8B8B;stroke-width:1;" x1="450.16" x2="504.3829" y1="92.164" y2="92.164"/><text fill="#383939" font-family="Ubuntu" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="41.2229" x="454.16" y="84.062">gisnix</text></g><!--cluster Your flake--><g class="cluster" data-qualified-name="Your flake" data-source-line="10" id="ent0005"><path d="M91.16,62.5661 L155.2192,62.5661 A9,9 0 0 1 161.2192,68.5661 L168.2192,87.634 L420.16,87.634 A6,6 0 0 1 426.16,93.634 L426.16,168.6961 A6,6 0 0 1 420.16,174.6961 L91.16,174.6961 A6,6 0 0 1 85.16,168.6961 L85.16,68.5661 A6,6 0 0 1 91.16,62.5661" fill="#FFFFFF" style="stroke:#8A8B8B;stroke-width:1;"/><line style="stroke:#8A8B8B;stroke-width:1;" x1="85.16" x2="168.2192" y1="87.634" y2="87.634"/><text fill="#383939" font-family="Ubuntu" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="70.0592" x="89.16" y="79.532">Your flake</text></g><!--entity gcontent--><g class="entity" data-qualified-name="gisnix.gcontent" data-source-line="6" id="ent0003"><rect fill="#FCF3E0" height="49.0679" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="218.8773" x="465.72" y="105.0961"/><rect fill="#FCF3E0" height="10" style="stroke:#DF9E2F;stroke-width:1;" width="15" x="664.5973" y="110.0961"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="662.5973" y="112.0961"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="662.5973" y="116.0961"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="178.8773" x="480.72" y="140.062">bundles &#183; profiles &#183; overlays</text></g><!--entity mkhost--><g class="entity" data-qualified-name="gisnix.mkhost" data-source-line="7" id="ent0004"><rect fill="#FCF3E0" height="49.0679" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="110.7557" x="465.78" y="264.4261"/><rect fill="#FCF3E0" height="10" style="stroke:#DF9E2F;stroke-width:1;" width="15" x="556.5357" y="269.4261"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="554.5357" y="271.4261"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="554.5357" y="275.4261"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="70.7557" x="480.78" y="299.392">lib.mkHost</text></g><!--entity hosts--><g class="entity" data-qualified-name="Your flake.hosts" data-source-line="11" id="ent0006"><rect fill="#EAF3F8" height="58.1358" rx="6" ry="6" style="stroke:#8A8B8B;stroke-width:1;" width="161.7354" x="248.29" y="100.5661"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="69.2717" x="258.29" y="125.532">your hosts</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="141.7354" x="258.29" y="144.5999">laptop-1 &#183; server-1 &#183; ...</text></g><!--entity users--><g class="entity" data-qualified-name="Your flake.users" data-source-line="12" id="ent0007"><rect fill="#EAF3F8" height="58.1358" rx="6" ry="6" style="stroke:#8A8B8B;stroke-width:1;" width="112.6096" x="100.86" y="100.5661"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="69.4257" x="110.86" y="125.532">your users</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="92.6096" x="110.86" y="144.5999">and their keys</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="20" id="ent0012"><path d="M11,245.6961 L11,332.2262 A6,6 0 0 0 17,338.2262 L297.3232,338.2262 A6,6 0 0 0 303.3232,332.2262 L303.3232,249.6961 L293.3232,239.6961 L161.16,239.6961 L157.16,159.1161 L153.16,239.6961 L17,239.6961 A6,6 0 0 0 11,245.6961" fill="#EAF3F8" style="stroke:#569FC6;stroke-width:1;"/><path d="M293.3232,239.6961 L293.3232,246.6961 A3,3 0 0 0 296.3232,249.6961 L303.3232,249.6961 L293.3232,239.6961" fill="#EAF3F8" style="stroke:#569FC6;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="255.2422" x="17" y="258.5931">Your flake pins gisnix and calls lib.mkHost</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="258.9472" x="17" y="276.2991">for each machine. You keep only your own</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="269.1522" x="17" y="294.0051">hosts and users &#8212; a few lines &#8212; while every</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="271.3232" x="17" y="311.7111">bundle, profile and package still comes from</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="177.3332" x="17" y="329.4172">gisnix. Your fleet stays yours.</text></g><!--link hosts to mkhost--><g class="link" data-entity-1="ent0006" data-entity-2="ent0004" data-link-type="dependency" data-source-line="15" id="lnk8"><path d="M363.93,159.1161 C400.57,189.1361 452.9795,232.0827 487.3495,260.2527" fill="none" id="hosts-to-mkhost" style="stroke:#569FC6;stroke-width:1;"/><polygon fill="#569FC6" points="491.99,264.0561,487.5649,255.2573,488.1229,260.8866,482.4937,261.4447,491.99,264.0561" style="stroke:#569FC6;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="57.1091" x="426.16" y="205.5931">built with</text></g><!--link users to mkhost--><g class="link" data-entity-1="ent0007" data-entity-2="ent0004" data-link-type="dependency" data-source-line="16" id="lnk9"><path d="M193.58,159.1261 C205.19,167.4061 218.35,176.0161 231.16,182.6961 C308.81,223.1861 399.8151,253.1989 459.5951,270.8289" fill="none" id="users-to-mkhost" style="stroke:#569FC6;stroke-width:1;"/><polygon fill="#569FC6" points="465.35,272.5261,457.8491,266.1436,460.5542,271.1117,455.5861,273.8169,465.35,272.5261" style="stroke:#569FC6;stroke-width:1;"/></g><!--link gcontent to mkhost--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="17" id="lnk10"><path d="M566.96,154.5261 C556.78,184.1861 541.479,228.7814 531.299,258.4214" fill="none" id="gcontent-to-mkhost" style="stroke:#569FC6;stroke-width:1;"/><polygon fill="#569FC6" points="529.35,264.0961,536.0566,256.8835,530.9742,259.3672,528.4904,254.2848,529.35,264.0961" style="stroke:#569FC6;stroke-width:1;"/></g><?plantuml-src RP91IiKm48RtESLOjxw0k14NWe8Fho08ahRJDZITb2Ir5X4yX7Tnxr4yYPEaVK_1JKadyyzyCtzED5LcgX6UGeS3od4QZ1111uDmEsbJQsf1GMCG0zW65Zivi3E19GXsZA5MUz8lGeogwbMBKEH00Qy2eBB3Q0afG55EL1lqyFK9exEDNi_s6PrHYoz0UMWhIu6p_ogDBkNGtriVKjBGTtmKRxzQFaIingWUSrk7LL3KyX158eu2_qX6ZGozEuzzFJhkdCzIobGvfS7ftSt-Od_vJvc9HLn6KGsyBksWnnKytHoKZ9PBxNRNAovSGSdx333hq8cSVhmLs-2_Ou9iG2Xj27PWcEECC6howzuXmbJA60_7DN5sOnsWgZeO-AC9PTGpBx9dP9Q3aPoQKMETZFNz_X4jnvah4kR_kME_07bZ2okobMURZqcxUU63DYQwnyh69V9CAhS9ubFoWIrF45uAP7cSzGS0?></g></svg>