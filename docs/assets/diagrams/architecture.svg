<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="569px" preserveAspectRatio="none" style="width:1197px;height:569px;background:#FFFFFF;" version="1.1" viewBox="0 0 1197 569" width="1197px" zoomAndPan="magnify"><?plantuml 1.2026.3?><defs/><g><g class="title" data-source-line="3"><text fill="#383939" font-family="Ubuntu" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="428.6933" x="383.1534" y="38.5181">How one machine is described in gisnix</text></g><!--cluster What you write--><g class="cluster" data-qualified-name="What you write" data-source-line="5" id="ent0002"><path d="M17,62.5661 L115.7196,62.5661 A9,9 0 0 1 121.7196,68.5661 L128.7196,87.634 L452,87.634 A6,6 0 0 1 458,93.634 L458,187.7661 A6,6 0 0 1 452,193.7661 L17,193.7661 A6,6 0 0 1 11,187.7661 L11,68.5661 A6,6 0 0 1 17,62.5661" fill="#FFFFFF" style="stroke:#8A8B8B;stroke-width:1;"/><line style="stroke:#8A8B8B;stroke-width:1;" x1="11" x2="128.7196" y1="87.634" y2="87.634"/><text fill="#383939" font-family="Ubuntu" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="104.7196" x="15" y="79.532">What you write</text></g><!--cluster What gisnix provides--><g class="cluster" data-qualified-name="What gisnix provides" data-source-line="10" id="ent0005"><path d="M488,67.0961 L627.1305,67.0961 A9,9 0 0 1 633.1305,73.0961 L640.1305,92.164 L1176,92.164 A6,6 0 0 1 1182,98.164 L1182,183.2361 A6,6 0 0 1 1176,189.2361 L488,189.2361 A6,6 0 0 1 482,183.2361 L482,73.0961 A6,6 0 0 1 488,67.0961" fill="#FFFFFF" style="stroke:#8A8B8B;stroke-width:1;"/><line style="stroke:#8A8B8B;stroke-width:1;" x1="482" x2="640.1305" y1="92.164" y2="92.164"/><text fill="#383939" font-family="Ubuntu" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="145.1305" x="486" y="84.062">What gisnix provides</text></g><!--entity config--><g class="entity" data-qualified-name="What you write.config" data-source-line="6" id="ent0003"><rect fill="#EAF3F8" height="77.2038" rx="6" ry="6" style="stroke:#8A8B8B;stroke-width:1;" width="186.8654" x="26.57" y="100.5661"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="64.3017" x="36.57" y="125.532">config.nix</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="166.8654" x="36.57" y="144.5999">the software bundles this</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="139.9714" x="36.57" y="163.6679">machine should have</text></g><!--entity hardware--><g class="entity" data-qualified-name="What you write.hardware" data-source-line="7" id="ent0004"><rect fill="#EAF3F8" height="77.2038" rx="6" ry="6" style="stroke:#8A8B8B;stroke-width:1;" width="193.0393" x="248.48" y="100.5661"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="154.4194" x="258.48" y="125.532">hardware.nix &#183; disks.nix</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="134.3015" x="258.48" y="144.5999">what this machine is</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="173.0393" x="258.48" y="163.6679">and how its disk is laid out</text></g><!--entity bundles--><g class="entity" data-qualified-name="What gisnix provides.bundles" data-source-line="11" id="ent0006"><rect fill="#FCF3E0" height="68.1358" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="194.2514" x="497.87" y="105.0961"/><rect fill="#FCF3E0" height="10" style="stroke:#DF9E2F;stroke-width:1;" width="15" x="672.1214" y="110.0961"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="670.1214" y="112.0961"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="670.1214" y="116.0961"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="52.7378" x="512.87" y="140.062">bundles</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="154.2514" x="512.87" y="159.1299">named sets of software</text></g><!--entity profiles--><g class="entity" data-qualified-name="What gisnix provides.profiles" data-source-line="12" id="ent0007"><rect fill="#FCF3E0" height="68.1358" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="218.5273" x="726.74" y="105.0961"/><rect fill="#FCF3E0" height="10" style="stroke:#DF9E2F;stroke-width:1;" width="15" x="925.2673" y="110.0961"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="923.2673" y="112.0961"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="923.2673" y="116.0961"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="49.5038" x="741.74" y="140.062">profiles</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="178.5273" x="741.74" y="159.1299">desktop, common, services</text></g><!--entity overlays--><g class="entity" data-qualified-name="What gisnix provides.overlays" data-source-line="13" id="ent0008"><rect fill="#FCF3E0" height="68.1358" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="185.5854" x="980.21" y="105.0961"/><rect fill="#FCF3E0" height="10" style="stroke:#DF9E2F;stroke-width:1;" width="15" x="1145.7954" y="110.0961"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="1143.7954" y="112.0961"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="1143.7954" y="116.0961"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="54.5718" x="995.21" y="140.062">overlays</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="145.5854" x="995.21" y="159.1299">gisnix's own packages</text></g><!--entity mkhost--><g class="entity" data-qualified-name="mkhost" data-source-line="16" id="ent0009"><rect fill="#FCF3E0" height="58.1358" rx="6" ry="6" style="stroke:#8A8B8B;stroke-width:1;" width="174.4334" x="507.78" y="237.7661"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="70.7557" x="517.78" y="262.732">lib.mkHost</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="154.4334" x="517.78" y="281.7999">assembles the machine</text></g><!--entity system--><g class="entity" data-qualified-name="system" data-source-line="18" id="ent0010"><rect fill="#E6F4F4" height="58.1358" rx="6" ry="6" style="stroke:#8A8B8B;stroke-width:1;" width="206.5773" x="491.71" y="355.9061"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="103.0956" x="501.71" y="380.872">A NixOS system</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="186.5773" x="501.71" y="399.9399">(one build = one generation)</text></g><g class="entity" data-qualified-name="GMN17" data-source-line="28" id="ent0018"><path d="M442.26,480.0461 L442.26,548.8702 A6,6 0 0 0 448.26,554.8702 L741.7392,554.8702 A6,6 0 0 0 747.7392,548.8702 L747.7392,484.0461 L737.7392,474.0461 L599,474.0461 L595,414.2661 L591,474.0461 L448.26,474.0461 A6,6 0 0 0 442.26,480.0461" fill="#EAF3F8" style="stroke:#569FC6;stroke-width:1;"/><path d="M737.7392,474.0461 L737.7392,481.0461 A3,3 0 0 0 740.7392,484.0461 L747.7392,484.0461 L737.7392,474.0461" fill="#EAF3F8" style="stroke:#569FC6;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="284.4792" x="448.26" y="492.9431">Every rebuild makes a new generation you can</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="269.4513" x="448.26" y="510.6491">boot into or roll back to. Nothing is changed</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="259.6232" x="448.26" y="528.3551">in place; the whole machine is rebuilt from</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="65.2211" x="448.26" y="546.0611">these files.</text></g><!--link config to mkhost--><g class="link" data-entity-1="ent0003" data-entity-2="ent0009" data-link-type="dependency" data-source-line="20" id="lnk11"><path d="M179.94,178.1761 C196.03,187.0361 213.76,195.6661 231,201.7661 C322.33,234.1261 426.5945,249.9539 501.6545,258.0339" fill="none" id="config-to-mkhost" style="stroke:#569FC6;stroke-width:1;"/><polygon fill="#569FC6" points="507.62,258.6761,499.0998,253.7358,502.6487,258.1409,498.2436,261.6898,507.62,258.6761" style="stroke:#569FC6;stroke-width:1;"/></g><!--link hardware to mkhost--><g class="link" data-entity-1="ent0004" data-entity-2="ent0009" data-link-type="dependency" data-source-line="21" id="lnk12"><path d="M420.69,178.2161 C458.48,197.2161 498.079,217.1217 532.879,234.6117" fill="none" id="hardware-to-mkhost" style="stroke:#569FC6;stroke-width:1;"/><polygon fill="#569FC6" points="538.24,237.3061,531.9947,229.6905,533.7725,235.0608,528.4022,236.8385,538.24,237.3061" style="stroke:#569FC6;stroke-width:1;"/></g><!--link bundles to mkhost--><g class="link" data-entity-1="ent0006" data-entity-2="ent0009" data-link-type="dependency" data-source-line="22" id="lnk13"><path d="M595,173.5161 C595,193.4361 595,212.4761 595,231.4561" fill="none" id="bundles-to-mkhost" style="stroke:#569FC6;stroke-width:1;"/><polygon fill="#569FC6" points="595,237.4561,599,228.4561,595,232.4561,591,228.4561,595,237.4561" style="stroke:#569FC6;stroke-width:1;"/></g><!--link profiles to mkhost--><g class="link" data-entity-1="ent0007" data-entity-2="ent0009" data-link-type="dependency" data-source-line="23" id="lnk14"><path d="M771.73,173.6761 C733.67,193.5261 691.2706,215.6428 655.0106,234.5428" fill="none" id="profiles-to-mkh