<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="626px" preserveAspectRatio="none" style="width:676px;height:626px;background:#FFFFFF;" version="1.1" viewBox="0 0 676 626" width="676px" zoomAndPan="magnify"><?plantuml 1.2026.3?><defs/><g><g class="title" data-source-line="3"><text fill="#383939" font-family="Ubuntu" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="644.1069" x="15" y="38.5181">Software bundles &#8212; you ask for a capability, not a parts list</text></g><!--cluster A bundle--><g class="cluster" data-qualified-name="A bundle" data-source-line="7" id="ent0003"><path d="M29.2498,341.2341 L84.9301,341.2341 A9,9 0 0 1 90.9301,347.2341 L97.9301,366.302 L333.2498,366.302 A6,6 0 0 1 339.2498,372.302 L339.2498,605.5741 A6,6 0 0 1 333.2498,611.5741 L29.2498,611.5741 A6,6 0 0 1 23.2498,605.5741 L23.2498,347.2341 A6,6 0 0 1 29.2498,341.2341" fill="#FFFFFF" style="stroke:#8A8B8B;stroke-width:1;"/><line style="stroke:#8A8B8B;stroke-width:1;" x1="23.2498" x2="97.9301" y1="366.302" y2="366.302"/><text fill="#383939" font-family="Ubuntu" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="61.6803" x="27.2498" y="358.2">A bundle</text></g><!--entity meta--><g class="entity" data-qualified-name="A bundle.meta" data-source-line="8" id="ent0004"><rect fill="#FCF3E0" height="68.1358" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="283.473" x="39.5098" y="379.2341"/><rect fill="#FCF3E0" height="10" style="stroke:#DF9E2F;stroke-width:1;" width="15" x="302.9829" y="384.2341"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="300.9829" y="386.2341"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="300.9829" y="390.2341"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="77.2237" x="54.5098" y="414.2">bundle.json</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="243.473" x="54.5098" y="433.268">name &#183; what it needs &#183; what it implies</text></g><!--entity modules--><g class="entity" data-qualified-name="A bundle.modules" data-source-line="9" id="ent0005"><rect fill="#FCF3E0" height="87.2038" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="181.6095" x="90.4498" y="508.3741"/><rect fill="#FCF3E0" height="10" style="stroke:#DF9E2F;stroke-width:1;" width="15" x="252.0593" y="513.3741"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="250.0593" y="515.3741"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="250.0593" y="519.3741"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="73.7517" x="105.4498" y="543.34">module.nix</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="73.7517" x="105.4498" y="562.408">module.nix</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="141.6095" x="105.4498" y="581.4759">...the actual packages</text></g><!--entity config--><g class="entity" data-qualified-name="config" data-source-line="5" id="ent0002"><rect fill="#EAF3F8" height="58.1358" rx="6" ry="6" style="stroke:#8A8B8B;stroke-width:1;" width="212.6112" x="234.9398" y="62.9641"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="64.3017" x="244.9398" y="87.93">config.nix</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="192.6112" x="244.9398" y="106.998">the bundles this machine has</text></g><!--entity gis--><g class="entity" data-qualified-name="gis" data-source-line="12" id="ent0006"><rect fill="#F5F5F2" height="58.1358" rx="6" ry="6" style="stroke:#8A8B8B;stroke-width:1;" width="225.3232" x="228.5898" y="200.0941"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="76.2577" x="238.5898" y="225.06">desktop-gis</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="205.3232" x="238.5898" y="244.128">(QGIS and the geospatial stack)</text></g><!--entity cosmic--><g class="entity" data-qualified-name="cosmic" data-source-line="13" id="ent0007"><rect fill="#F5F5F2" height="58.1358" rx="6" ry="6" style="stroke:#8A8B8B;stroke-width:1;" width="168.1054" x="388.1998" y="384.2341"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="102.6476" x="398.1998" y="409.2">desktop-cosmic</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="148.1054" x="398.1998" y="428.268">(the desktop it runs in)</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="21" id="ent0013"><path d="M355.6498,526.4141 L355.6498,577.5322 A6,6 0 0 0 361.6498,583.5322 L642.857,583.5322 A6,6 0 0 0 648.857,577.5322 L648.857,530.4141 L638.857,520.4141 L499.5198,520.4141 L478.4698,442.6241 L491.5198,520.4141 L361.6498,520.4141 A6,6 0 0 0 355.6498,526.4141" fill="#EAF3F8" style="stroke:#569FC6;stroke-width:1;"/><path d="M638.857,520.4141 L638.857,527.4141 A3,3 0 0 0 641.857,530.4141 L648.857,530.4141 L638.857,520.4141" fill="#EAF3F8" style="stroke:#569FC6;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="241.2022" x="361.6498" y="539.3111">You named one capability. Everything it</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="230.4772" x="361.6498" y="557.0171">depends on is pulled in automatically,</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="272.2072" x="361.6498" y="574.7231">because each bundle declares what it needs.</text></g><!--link config to gis--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" data-link-type="dependency" data-source-line="15" id="lnk8"><path d="M341.2498,121.3641 C341.2498,144.4241 341.2498,170.8241 341.2498,193.8741" fill="none" id="config-to-gis" style="stroke:#569FC6;stroke-width:1;"/><polygon fill="#569FC6" points="341.2498,199.8741,345.2498,190.8741,341.2498,194.8741,337.2498,190.8741,341.2498,199.8741" style="stroke:#569FC6;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="108.4721" x="342.2498" y="165.9911">you asked for this</text></g><!--link gis to cosmic--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" data-link-type="dependency" data-source-line="16" id="lnk9"><path d="M361.7198,258.6241 C386.2598,292.7441 423.6364,344.7132 448.2064,378.8732" fill="none" id="gis-to-cosmic" style="stroke:#569FC6;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#569FC6" points="451.7098,383.7441,449.7019,374.1021,448.7903,379.685,443.2074,378.7734,451.7098,383.7441" style="stroke:#569FC6;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="43.771" x="436.0249" y="303.1311">implies</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="100.3211" x="407.7498" y="320.8371">(so it comes too)</text></g><!--link gis to meta--><g class="link" data-entity-1="ent0006" data-entity-2="ent0004" data-link-type="dependency" data-source-line="17" id="lnk10"><path d="M316.2498,258.6241 C287.6898,291.1441 244.9492,339.7859 214.6492,374.2859" fill="none" id="gis-to-meta" style="stroke:#569FC6;stroke-width:1;"/><polygon fill="#569FC6" points="210.6898,378.7941,219.6343,374.6714,213.9893,375.0373,213.6234,369.3923,210.6898,378.7941" style="stroke:#569FC6;stroke-width:1;"/></g><!--link meta to modules--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="18" id="lnk11"><path d="M181.2498,447.7341 C181.2498,465.9141 18