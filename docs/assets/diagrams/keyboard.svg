<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="765px" preserveAspectRatio="none" style="width:614px;height:765px;background:#FFFFFF;" version="1.1" viewBox="0 0 614 765" width="614px" zoomAndPan="magnify"><?plantuml 1.2026.3?><defs/><g><g class="title" data-source-line="3"><text fill="#383939" font-family="Ubuntu" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="582.0338" x="15" y="38.5181">The keyboard, remapped &#8212; and speech on a held key</text></g><!--entity kbd--><g class="entity" data-qualified-name="kbd" data-source-line="5" id="ent0002"><rect fill="#F5F5F2" height="68.1358" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="170.3955" x="196.5148" y="62.9641"/><rect fill="#F5F5F2" height="10" style="stroke:#DF9E2F;stroke-width:1;" width="15" x="346.9103" y="67.9641"/><rect fill="#F5F5F2" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="344.9103" y="69.9641"/><rect fill="#F5F5F2" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="344.9103" y="73.9641"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="96.3056" x="211.5148" y="97.93">Your keyboard</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="130.3955" x="211.5148" y="116.998">(built-in or external)</text></g><!--entity kanata--><g class="entity" data-qualified-name="kanata" data-source-line="6" id="ent0003"><rect fill="#EAF3F8" height="68.1358" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="320.7969" x="121.3048" y="210.0941"/><rect fill="#EAF3F8" height="10" style="stroke:#DF9E2F;stroke-width:1;" width="15" x="422.1017" y="215.0941"/><rect fill="#EAF3F8" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="420.1017" y="217.0941"/><rect fill="#EAF3F8" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="420.1017" y="221.0941"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="44.7438" x="136.3048" y="245.06">kanata</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="280.7969" x="136.3048" y="264.128">home-row mods &#183; navigation layer &#183; chords</text></g><!--entity app--><g class="entity" data-qualified-name="app" data-source-line="7" id="ent0004"><rect fill="#FCF3E0" height="68.1358" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="150.6556" x="172.3848" y="522.3641"/><rect fill="#FCF3E0" height="10" style="stroke:#DF9E2F;stroke-width:1;" width="15" x="303.0404" y="527.3641"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="301.0404" y="529.3641"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="301.0404" y="533.3641"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="100.6316" x="187.3848" y="557.33">The application</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="110.6556" x="187.3848" y="576.398">you are typing in</text></g><!--entity vox--><g class="entity" data-qualified-name="vox" data-source-line="12" id="ent0007"><rect fill="#E6F4F4" height="68.1358" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="132.6936" x="348.3648" y="357.2341"/><rect fill="#E6F4F4" height="10" style="stroke:#DF9E2F;stroke-width:1;" width="15" x="461.0585" y="362.2341"/><rect fill="#E6F4F4" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="459.0585" y="364.2341"/><rect fill="#E6F4F4" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="459.0585" y="368.2341"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="51.6878" x="363.3648" y="392.2">voxtype</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="92.6936" x="363.3648" y="411.268">speech to text</text></g><g class="entity" data-qualified-name="GMN10" data-source-line="17" id="ent0011"><path d="M106.6748,657.5041 L106.6748,744.0342 A6,6 0 0 0 112.6748,750.0342 L382.741,750.0342 A6,6 0 0 0 388.741,744.0342 L388.741,661.5041 L378.741,651.5041 L251.7048,651.5041 L247.7048,590.8041 L243.7048,651.5041 L112.6748,651.5041 A6,6 0 0 0 106.6748,657.5041" fill="#EAF3F8" style="stroke:#569FC6;stroke-width:1;"/><path d="M378.741,651.5041 L378.741,658.5041 A3,3 0 0 0 381.741,661.5041 L388.741,661.5041 L378.741,651.5041" fill="#EAF3F8" style="stroke:#569FC6;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="232.6872" x="112.6748" y="670.4011">kanata sits between the keyboard and</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="261.0662" x="112.6748" y="688.1071">everything else, so the same remapping &#8212;</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="228.1372" x="112.6748" y="705.8131">and the same hold-to-talk &#8212; works in</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="213.2782" x="112.6748" y="723.5192">every application without each one</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="156.6242" x="112.6748" y="741.2252">needing to know about it.</text></g><!--link kbd to kanata--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="9" id="lnk5"><path d="M281.7048,131.3241 C281.7048,154.8441 281.7048,180.2341 281.7048,203.7741" fill="none" id="kbd-to-kanata" style="stroke:#569FC6;stroke-width:1;"/><polygon fill="#569FC6" points="281.7048,209.7741,285.7048,200.7741,281.7048,204.7741,277.7048,200.7741,281.7048,209.7741" style="stroke:#569FC6;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spa