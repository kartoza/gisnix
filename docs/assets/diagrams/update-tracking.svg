<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="395px" preserveAspectRatio="none" style="width:621px;height:395px;background:#FFFFFF;" version="1.1" viewBox="0 0 621 395" width="621px" zoomAndPan="magnify"><?plantuml 1.2026.3?><defs/><g><g class="title" data-source-line="3"><text fill="#383939" font-family="Ubuntu" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="548.0108" x="35.6162" y="38.5181">Two ways to follow gisnix &#8212; your flake.nix decides</text></g><!--entity flake--><g class="entity" data-qualified-name="flake" data-source-line="5" id="ent0002"><rect fill="#F5F5F2" height="58.1358" rx="6" ry="6" style="stroke:#8A8B8B;stroke-width:1;" width="183.4529" x="216.72" y="62.9641"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="100.7996" x="226.72" y="87.93">Your machine's</text><text fill="#383939" font-family="Ubuntu" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="59.0133" x="331.1596" y="87.93">flake.nix</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="137.8714" x="226.72" y="106.998">(the gisnix input line)</text></g><!--entity pin--><g class="entity" data-qualified-name="pin" data-source-line="7" id="ent0003"><rect fill="#F5F5F2" height="58.1358" rx="6" ry="6" style="stroke:#8A8B8B;stroke-width:1;" width="274.715" x="29.09" y="181.1041"/><text fill="#383939" font-family="Ubuntu" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="133.4195" x="39.09" y="206.07">Pinned to a version</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="254.715" x="39.09" y="225.138">`url = \"github:kartoza/gisnix/v0.19.0\"`</text></g><!--entity main--><g class="entity" data-qualified-name="main" data-source-line="8" id="ent0004"><rect fill="#F5F5F2" height="58.1358" rx="6" ry="6" style="stroke:#8A8B8B;stroke-width:1;" width="222.8592" x="347.02" y="181.1041"/><text fill="#383939" font-family="Ubuntu" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="98.5876" x="357.02" y="206.07">Tracking main</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="202.8592" x="357.02" y="225.138">`url = \"github:kartoza/gisnix\"`</text></g><g class="entity" data-qualified-name="GMN7" data-source-line="14" id="ent0008"><path d="M11,305.2441 L11,374.0682 A6,6 0 0 0 17,380.0682 L285.8962,380.0682 A6,6 0 0 0 291.8962,374.0682 L291.8962,309.2441 L281.8962,299.2441 L160.13,299.2441 L163.12,239.4641 L152.13,299.2441 L17,299.2441 A6,6 0 0 0 11,305.2441" fill="#EAF3F8" style="stroke:#569FC6;stroke-width:1;"/><path d="M281.8962,299.2441 L281.8962,306.2441 A3,3 0 0 0 284.8962,309.2441 L291.8962,309.2441 L281.8962,299.2441" fill="#EAF3F8" style="stroke:#569FC6;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="242.6842" x="17" y="318.1411">A tag never moves, so `nix flake update`</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="133.3932" x="17" y="335.8471">changes nothing until</text><text fill="#383939" font-family="Ubuntu" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="23.7478" x="153.7732" y="335.8471">you</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="46.813" x="180.9009" y="335.8471">edit the</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="256.5422" x="17" y="353.5531">version. You decide when to step forward.</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="259.8962" x="17" y="371.2592">Reproducible and calm &#8212; the safer choice.</text></g><g class="entity" data-qualified-name="GMN10" data-source-line="21" id="ent0011"><path d="M326.66,305.2441 L326.66,374.0682 A6,6 0 0 0 332.66,380.0682 L600.2432,380.0682 A6,6 0 0 0 606.2432,374.0682 L606.2432,309.2441 L596.2432,299.2441 L467.95,299.2441 L460.22,239.4641 L459.95,299.2441 L332.66,299.2441 A6,6 0 0 0 326.66,305.2441" fill="#EAF3F8" style="stroke:#569FC6;stroke-width:1;"/><path d="M596.2432,299.2441 L596.2432,306.2441 A3,3 0 0 0 599.2432,309.2441 L606.2432,309.2441 L596.2432,299.2441" fill="#EAF3F8" style="stroke:#569FC6;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="211.5232" x="332.66" y="318.1411">main moves with every commit, so</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="232.8042" x="332.66" y="335.8471">`nix flake update` jumps to the newest</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="258.5832" x="332.66" y="353.5531">gisnix &#8212; released or not. Newest features,</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="246.2722" x="332.66" y="371.2592">the occasional rough edge. For the bold.</text></g><!--link flake to pin--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="10" id="lnk5"><path d="M273.71,121.4441 C251.71,139.4441 227.9942,158.8352 205.9642,176.8552" fill="none" id="flake-to-pin" style="stroke:#569FC6;stroke-width:1;"/><polygon fill="#569FC6" points="201.32,180.6541,210.8189,178.052,205.1902,177.4884,205.7538,171.8597,201.32,180.6541" style="stroke:#569FC6;stroke-width:1;"/></g><!--link flake to main--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="11" id="lnk6"><path d="M345.14,121.4441 C368.39,139.4441 393.5961,158.9605 416.8661,176.9805" fill="none" id="flake-to-main" style="stroke:#569FC6;stroke-width:1;"/><polygon fill="#569FC6" points="421.61,180.6541,416.9432,171.9811,417.6568,17