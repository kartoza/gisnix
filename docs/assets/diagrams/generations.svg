<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="446px" preserveAspectRatio="none" style="width:776px;height:446px;background:#FFFFFF;" version="1.1" viewBox="0 0 776 446" width="776px" zoomAndPan="magnify"><?plantuml 1.2026.3?><defs/><g><g class="title" data-source-line="3"><text fill="#383939" font-family="Ubuntu" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="563.3997" x="105.3279" y="38.5181">Rebuilds and rollbacks &#8212; every change is reversible</text></g><g class="entity" data-qualified-name="g1" id="ent0002"><rect fill="#FCF3E0" height="58.1358" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="179.1654" x="581.89" y="190.0141"/><line style="stroke:#DF9E2F;stroke-width:1;" x1="581.89" x2="761.0554" y1="238.1499" y2="238.1499"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="85.7077" x="591.89" y="209.98">Generation 1</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="159.1654" x="591.89" y="229.048">the machine as installed</text></g><g class="entity" data-qualified-name="g2" id="ent0003"><rect fill="#FCF3E0" height="58.1358" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="169.1834" x="188.88" y="374.1941"/><line style="stroke:#DF9E2F;stroke-width:1;" x1="188.88" x2="358.0634" y1="422.3299" y2="422.3299"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="85.7077" x="198.88" y="394.16">Generation 2</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="149.1834" x="198.88" y="413.228">after you add a bundle</text></g><g class="entity" data-qualified-name="g3" id="ent0004"><rect fill="#FCF3E0" height="58.1358" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="226.9472" x="12" y="190.0141"/><line style="stroke:#DF9E2F;stroke-width:1;" x1="12" x2="238.9472" y1="238.1499" y2="238.1499"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="85.7077" x="22" y="209.98">Generation 3</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="206.9472" x="22" y="229.048">after a change that misbehaves</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="9" id="ent0002"><ellipse cx="671.47" cy="71.9641" fill="#569FC6" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN2" data-source-line="15" id="ent0003"><path d="M274,166.9641 L274,215.0841 L239.31,219.0841 L274,223.0841 L274,271.2002 A6,6 0 0 0 280,277.2002 L540.9533,277.2002 A6,6 0 0 0 546.9533,271.2002 L546.9533,170.9641 L536.9533,160.9641 L280,160.9641 A6,6 0 0 0 274,166.9641" fill="#EAF3F8" style="stroke:#569FC6;stroke-width:1;"/><path d="M536.9533,160.9641 L536.9533,167.9641 A3,3 0 0 0 539.9533,170.9641 L546.9533,170.9641 L536.9533,160.9641" fill="#EAF3F8" style="stroke:#569FC6;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="251.9533" x="280" y="179.8611">A rebuild never edits the running system.</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="226.6422" x="280" y="197.5671">It builds a whole new generation and</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="240.8252" x="280" y="215.2731">switches to it, keeping the old ones. If a</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="245.8172" x="280" y="232.9792">change is wrong, reboot and choose the</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="234.9232" x="280" y="250.6852">previous generation &#8212; you are exactly</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="101.3091" x="280" y="268.3912">where you were.</text></g><!--link *start* to g1--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" data-source-line="9" id="lnk3"><path d="M671.47,82.0441 C671.47,103.2041 671.47,150.5141 671.47,183.7741" fill="none" id="*start*-to-g1" style="stroke:#569FC6;stroke-width:1;"/><polygon fill="#569FC6" points="671.47,189.7741,675.47,180.7741,671.47,184.7741,667.47,180.7741,671.47,189.7741" style="stroke:#569FC6;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="36.309" x="672.47" y="126.8611">install</text></g><!--link g1 to g2--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="10" id="lnk4"><path d="M620.22,248.5741 C602.7,258.0041 582.88,268.3441 564.47,277.1941 C490.51,312.7541 409.4315,347.088 350.0415,371.438" fill="none" id="g1-to-g2" style="stroke:#569FC6;stroke-width:1;"/><polygon fill="#569FC6" points="344.49,373.7141,354.3347,374.0009,349.1163,371.8173,351.2998,366.5989,344.49,373.7141" style="stroke:#569FC6;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="82.5631" x="494.52" y="331.0911">gisnix update</text></g><!--link g2 to g3--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="11" id="lnk5"><path d="M265.93,373.7141 C259.71,353.7441 249.45,327.1841 234.47,307.1941 C217.26,284.2241 197.5228,267.3269 176.0228,252.0669" fill="none" id="g2-to-g3" style="stroke:#569FC6;stroke-width:1;"/><polygon fill="#569FC6" points="171.13,248.5941,176.1541,257.0652,175.2074,251.4881,180.7844,250.5414,171.13,248.5941" style="stroke:#569FC6;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="82.5631" x="255.97" y="331.0911">gisnix update</text></g><!--link g3 to g2--><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" data-link-type="dependency" data-source-line="12" id="lnk6"><path d="M114.64,248.4041 C106.27,275.4641 99.05,316.1741 118.47,344.1941 C134.76,367.6941 156.0778,379.9315 183.0478,388.2715" fill="none" id="g3-to-g2" style="stroke:#569FC6;stroke-width:1;"/><polygon fill="#569FC6" points="188.78,390.0441,181.3634,383.5638,184.0032,388.567,179,391.2067,188.78,390.0441" style="stroke:#569FC6;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="106.0281" x="119.47" y="322.0911">pick generation 2</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="105.5601" x="119.704" y="339.7971">in the boot menu</text></g><?plantuml-src RLAxJiD04EplAmPA1958EWeaAaHB2mYTVHlVAkSzwnvnql4HV25VmfvH10WwxzxCxEoEprZwK1tXjNWQQJNLCHXJk0J28tMLWykmuf1Y29tjTnaVR--WFQKZUczb8716QetCNI1ZSh65S7vFGiaMZeBhPr5rZBRtB0IRmQAe4CYTjsgu_eUqVXQxBPHmZ1NMELXqLLoWByhw7yhcHB4dQyNRWf5pHzxkANzHDyOyNRpWwkfM9-FcPCPeiVJMsXiu2nzG9wT3ZBQMbytVbyqtP-9-X-7N1YnectSngWsIQen4DPruy0Lnsxm0Ttg-vTAGTaQGuv8NNggY4WFoCHSQLufzA3Y5Wjb7JKbe_ZbKir9OdhdqdbGbWiibTaHJ4sgYKGT5eRp2mnPMmTynpYdASDdiDCCjzjx7cDiTIO6Jnionvf_psj-m99G8TB1z2KT5pfwqRlrPFrQ6LAfj_Wa0?></g></svg>