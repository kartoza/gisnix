<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1358px" preserveAspectRatio="none" style="width:638px;height:1358px;background:#FFFFFF;" version="1.1" viewBox="0 0 638 1358" width="638px" zoomAndPan="magnify"><?plantuml 1.2026.3?><defs/><g><g class="title" data-source-line="3"><text fill="#383939" font-family="Ubuntu" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="606.267" x="15" y="38.5181">Installing gisnix &#8212; from USB stick to a running machine</text></g><ellipse cx="223.3502" cy="70.9641" fill="#569FC6" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><rect fill="#FCF3E0" height="36.3441" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="174.4051" x="136.1476" y="100.9641"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="154.4051" x="146.1476" y="123.7922">Write the ISO to a USB stick</text><rect fill="#FCF3E0" height="52.6882" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="157.437" x="144.6317" y="157.3082"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="137.437" x="154.6317" y="180.1363">Boot the target machine</text><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="113.7248" x="154.6317" y="196.4804">from the stick (UEFI)</text><rect fill="#FCF3E0" height="36.3441" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="111.3596" x="167.6704" y="229.9964"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="22.2961" x="177.6704" y="252.8245">Run</text><text fill="#383939" font-family="Ubuntu" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="65.9435" x="203.0865" y="252.8245">sudo setup</text><rect fill="#FFFFFF" height="272.7885" rx="6" ry="6" style="stroke:#000000;stroke-width:1;" width="224.5373" x="111.0815" y="276.3406"/><path d="M293.3369,276.3406 L293.3369,288.4085 L283.3369,298.4085 L111.0815,298.4085" fill="none" style="stroke:#000000;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="172.2553" x="114.0815" y="292.3065">The setup wizard asks you</text><rect fill="#FCF3E0" height="36.3441" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="154.1249" x="146.2877" y="315.4085"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="134.1249" x="156.2877" y="338.2366">Your name and account</text><rect fill="#FCF3E0" height="36.3441" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="87.6805" x="179.5099" y="371.7526"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="67.6805" x="189.5099" y="394.5807">A hostname</text><rect fill="#FCF3E0" height="52.6882" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="204.5373" x="121.0815" y="428.0967"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="43.5003" x="131.0815" y="450.9248">A locale</text><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="184.5373" x="131.0815" y="467.2689">(keyboard &#183; timezone &#183; language)</text><rect fill="#FCF3E0" height="36.3441" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="112.0407" x="167.3298" y="500.7849"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="92.0407" x="177.3298" y="523.613">A storage layout</text><rect fill="#FCF3E0" height="52.6882" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="162.009" x="142.3457" y="618.62"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="142.009" x="152.3457" y="641.4481">Choose a disk-encryption</text><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="64.6085" x="152.3457" y="657.7922">passphrase</text><polygon fill="#EAF3F8" points="183.338,569.129,263.3624,569.129,275.3624,581.129,263.3624,593.129,183.338,593.129,171.338,581.129,183.338,569.129" style="stroke:#569FC6;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="11" lengthAdjust="spacing" textLength="75.9874" x="227.3502" y="604.888">ZFS, encrypted</text><text fill="#383939" font-family="Ubuntu" font-size="11" lengthAdjust="spacing" textLength="80.0244" x="183.338" y="585.397">Storage layout?</text><text fill="#383939" font-family="Ubuntu" font-size="11" lengthAdjust="spacing" textLength="128.1931" x="275.3624" y="577.9061">plain XFS / multi-disk ZFS</text><polygon fill="#EAF3F8" points="223.3502,691.3082,235.3502,703.3082,223.3502,715.3082,211.3502,703.3082,223.3502,691.3082" style="stroke:#569FC6;stroke-width:1;"/><rect fill="#FCF3E0" height="69.0323" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="219.5494" x="113.5755" y="735.3082"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="199.5494" x="123.5755" y="758.1363">Confirm &#8212; type the hostname back</text><text fill="#383939" font-family="Ubuntu" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="153.661" x="123.5755" y="774.4804">This is the point of no return:</text><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="135.325" x="123.5755" y="790.8245">the target disk is erased</text><rect fill="#FFFFFF" height="321.8208" rx="6" ry="6" style="stroke:#000000;stroke-width:1;" width="205.4332" x="120.6336" y="814.3406"/><path d="M301.0269,814.3406 L301.0269,826.4085 L291.0269,836.4085 L120.6336,836.4085" fill="none" style="stroke:#000000;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="170.3933" x="123.6336" y="830.3065">The installer does the rest</text><rect fill="#FCF3E0" height="52.6882" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="182.2652" x="132.2176" y="853.4085"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="162.2652" x="142.2176" y="876.2366">Partition and format the disk</text><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="37.0923" x="142.2176" y="892.5807">(disko)</text><rect fill="#FCF3E0" height="52.6882" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="158.493" x="144.1037" y="926.0967"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="93.4807" x="154.1037" y="948.9248">Build the system</text><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="138.493" x="154.1037" y="965.2689">and copy it onto the disk</text><rect fill="#FCF3E0" height="52.6882" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="138.4168" x="154.1418" y="998.7849"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="118.4168" x="164.1418" y="1021.613">Install NixOS and the</text><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="101.4367" x="164.1418" y="1037.9571">GRUB boot loader</text><rect fill="#FCF3E0" height="52.6882" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="185.4332" x="130.6336" y="1071.4732"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="165.4332" x="140.6336" y="1094.3013">Copy the machine's flake into</text><text fill="#383939" font-family="Ubuntu" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="78.1115" x="140.6336" y="1110.6454">/nixos-config</text><rect fill="#FCF3E0" height="36.3441" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="181.4012" x="132.6496" y="1156.1614"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="161.4012" x="142.6496" y="1178.9895">Reboot and remove the stick</text><path d="M270.6303,1202.5055 L270.6303,1247.7705 L250.6303,1251.7705 L270.6303,1255.7705 L270.6303,1301.0356 A0,0 0 0 0 270.6303,1301.0356 L522.1855,1301.0356 A0,0 0 0 0 522.1855,1301.0356 L522.1855,1212.5055 L512.1855,1202.5055 L270.6303,1202.5055 A0,0 0 0 0 270.6303,1202.5055" fill="#EAF3F8" style="stroke:#569FC6;stroke-width:1;"/><path d="M512.1855,1202.5055 L512.1855,1212.5055 L522.1855,1212.5055 L512.1855,1202.5055" fill="#EAF3F8" style="stroke:#569FC6;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="230.5552" x="276.6303" y="1221.4025">From here the machine is one flake at</text><text fill="#383939" font-family="Ubuntu" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="84.6203" x="276.6303" y="1239.1085">/nixos-config</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="140.2961" x="361.2506" y="1239.1085">. Change software with</text><text fill="#383939" font-family="Ubuntu" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="104.0098" x="276.6303" y="1256.8146">gisnix configure</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="79.9761" x="380.6401" y="1256.8146">, rebuild with</text><text fill="#383939" font-family="Ubuntu" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="87.4381" x="276.6303" y="1274.5206">gisnix update</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="115.3361" x="364.0684" y="1274.5206">, roll back from the</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="70.8371" x="276.6303" y="1292.2266">boot menu.</text><rect fill="#FCF3E0" height="36.3441" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="54.5602" x="196.0701" y="1233.5985"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="34.5602" x="206.0701" y="1256.4266">Log in</text><ellipse cx="223.3502" cy="1332.0356" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="223.3502" cy="1332.0356" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#569FC6;stroke-width:1;" x1="223.3502" x2="223.3502" y1="80.9641" y2="100.9641"/><polygon fill="#569FC6" points="219.3502,90.9641,223.3502,100.9641,227.3502,90.9641,223.3502,94.9641" style="stroke:#569FC6;stroke-width:1;"/><line style="stroke:#569FC6;stroke-width:1;" x1="223.3502" x2="223.3502" y1="137.3082" y2="157.3082"/><polygon fill="#569FC6" points="219.3502,147.3082,223.3502,157.3082,227.3502,147.3082,223.3502,151.3082" style="stroke:#569FC6;stroke-width:1;"/><line style="stroke:#569FC6;stroke-width:1;" x1="223.3502" x2="223.3502" y1="209.9964" y2="229.9964"/><polygon fill="#569FC6" points="219.3502,219.9964,223.3502,229.9964,227.3502,219.9964,223.3502,223.9964" style="stroke:#569FC6;stroke-width:1;"/><line style="stroke:#569FC6;stroke-width:1;" x1="223.3502" x2="223.3502" y1="351.7526" y2="371.7526"/><polygon fill="#569FC6" points="219.3502,361.7526,223.3502,371.7526,227.3502,361.7526,223.3502,365.7526" style="stroke:#569FC6;stroke-width:1;"/><line style="stroke:#569FC6;stroke-width:1;" x1="223.3502" x2="223.3502" y1="408.0967" y2="428.0967"/><polygon fill="#569FC6" points="219.3502,418.0967,223.3502,428.0967,227.3502,418.0967,223.3502,422.0967" style="stroke:#569FC6;stroke-width:1;"/><line style="stroke:#569FC6;stroke-width:1;" x1="223.3502" x2="223.3502" y1="480.7849" y2="500.7849"/><polygon fill="#569FC6" points="219.3502,490.7849,223.3502,500.7849,227.3502,490.7849,223.3502,494.7849" style="stroke:#569FC6;stroke-width:1;"/><line style="stroke:#569FC6;stroke-width:1;" x1="223.3502" x2="223.3502" y1="266.3406" y2="315.4085"/><polygon fill="#569FC6" points="219.3502,305.4085,223.3502,315.4085,227.3502,305.4085,223.3502,309.4085" style="stroke:#569FC6;stroke-width:1;"/><line style="stroke:#569FC6;stroke-width:1;" x1="223.3502" x2="223.3502" y1="593.129" y2="618.62"/><polygon fill="#569FC6" points="219.3502,608.62,223.3502,618.62,227.3502,608.62,223.3502,612.62" style="stroke:#569FC6;stroke-width:1;"/><line style="stroke:#569FC6;stroke-width:1;" x1="275.3624" x2="314.3547" y1="581.129" y2="581.129"/><polygon fill="#569FC6" points="310.3547,634.9641,314.3547,644.9641,318.3547,634.9641,314.3547,638.9641" style="stroke:#569FC6;stroke-width:1;"/><line style="stroke:#569FC6;stroke-width:1;" x1="314.3547" x2="314.3547" y1="581.129" y2="703.3082"/><line style="stroke:#569FC6;stroke-width:1;" x1="314.3547" x2="235.3502" y1="703.3082" y2="703.3082"/><polygon fill="#569FC6" points="245.3502,699.3082,235.3502,703.3082,245.3502,707.3082,241.3502,703.3082" style="stroke:#569FC6;stroke-width:1;"/><line style="stroke:#569FC6;stroke-width:1;" x1="223.3502" x2="223.3502" y1="671.3082" y2="691.3082"/><polygon fill="#569FC6" points="219.3502,681.3082,223.3502,691.3082,227.3502,681.3082,223.3502,685.3082" style="stroke:#569FC6;stroke-width:1;"/><line style="stroke:#569FC6;stroke-width:1;" x1="223.3502" x2="223.3502" y1="537.129" y2="569.129"/><polygon fill="#569FC6" points="219.3502,559.129,223.3502,569.129,227.3502,559.129,223.3502,563.129" style="stroke:#569FC6;stroke-width:1;"/><line style="stroke:#569FC6;stroke-width:1;" x1="223.3502" x2="223.3502" y1="715.3082" y2="735.3082"/><polygon fill="#569FC6" points="219.3502,725.3082,223.3502,735.3082,227.3502,725.3082,223.3502,729.3082" style="stroke:#569FC6;stroke-width:1;"/><line style="stroke:#569FC6;stroke-width:1;" x1="223.3502" x2="223.3502" y1="906.0967" y2="926.0967"/><polygon fill="#569FC6" points="219.3502,916.0967,223.3502,926.0967,227.3502,916.0967,223.3502,920.0967" style="stroke:#569FC6;stroke-width:1;"/><line style="stroke:#569FC6;stroke-width:1;" x1="223.3502" x2="223.3502" y1="978.7849" y2="998.7849"/><polygon fill="#569FC6" points="219.3502,988.7849,223.3502,998.7849,227.350