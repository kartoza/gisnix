<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1411px" preserveAspectRatio="none" style="width:638px;height:1411px;background:#FFFFFF;" version="1.1" viewBox="0 0 638 1411" width="638px" zoomAndPan="magnify"><?plantuml 1.2026.3?><defs/><g><g class="title" data-source-line="3"><text fill="#383939" font-family="Ubuntu" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="606.267" x="15" y="38.5181">Installing gisnix &#8212; from USB stick to a running machine</text></g><ellipse cx="282.6652" cy="70.9641" fill="#569FC6" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><rect fill="#FCF3E0" height="36.3441" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="174.4051" x="195.4626" y="100.9641"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="154.4051" x="205.4626" y="123.7922">Write the ISO to a USB stick</text><rect fill="#FCF3E0" height="52.6882" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="157.437" x="203.9467" y="157.3082"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="137.437" x="213.9467" y="180.1363">Boot the target machine</text><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="113.7248" x="213.9467" y="196.4804">from the stick (UEFI)</text><rect fill="#FCF3E0" height="52.6882" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="152.577" x="206.3767" y="229.9964"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="132.577" x="216.3767" y="252.8245">Connect to the network</text><text fill="#383939" font-family="Ubuntu" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="67.7794" x="216.3767" y="269.1686">sudo nmtui</text><rect fill="#FCF3E0" height="52.6882" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="116.9367" x="224.1968" y="302.6847"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="96.9367" x="234.1968" y="325.5128">Start the installer</text><text fill="#383939" font-family="Ubuntu" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="65.9435" x="234.1968" y="341.8569">sudo setup</text><rect fill="#FFFFFF" height="272.7885" rx="6" ry="6" style="stroke:#000000;stroke-width:1;" width="224.5373" x="170.3965" y="365.3729"/><path d="M352.6519,365.3729 L352.6519,377.4408 L342.6519,387.4408 L170.3965,387.4408" fill="none" style="stroke:#000000;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="172.2553" x="173.3965" y="381.3388">The setup wizard asks you</text><rect fill="#FCF3E0" height="36.3441" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="154.1249" x="205.6027" y="404.4408"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="134.1249" x="215.6027" y="427.2689">Your name and account</text><rect fill="#FCF3E0" height="36.3441" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="87.6805" x="238.8249" y="460.7849"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="67.6805" x="248.8249" y="483.613">A hostname</text><rect fill="#FCF3E0" height="52.6882" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="204.5373" x="180.3965" y="517.129"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="43.5003" x="190.3965" y="539.9571">A locale</text><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="184.5373" x="190.3965" y="556.3013">(keyboard &#183; timezone &#183; language)</text><rect fill="#FCF3E0" height="36.3441" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="112.0407" x="226.6448" y="589.8173"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="92.0407" x="236.6448" y="612.6454">A storage layout</text><rect fill="#FCF3E0" height="52.6882" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="162.009" x="201.6607" y="707.6523"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="142.009" x="211.6607" y="730.4804">Choose a disk-encryption</text><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="64.6085" x="211.6607" y="746.8245">passphrase</text><polygon fill="#EAF3F8" points="242.653,658.1614,322.6774,658.1614,334.6774,670.1614,322.6774,682.1614,242.653,682.1614,230.653,670.1614,242.653,658.1614" style="stroke:#569FC6;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="11" lengthAdjust="spacing" textLength="75.9874" x="286.6652" y="693.9203">ZFS, encrypted</text><text fill="#383939" font-family="Ubuntu" font-size="11" lengthAdjust="spacing" textLength="80.0244" x="242.653" y="674.4294">Storage layout?</text><text fill="#383939" font-family="Ubuntu" font-size="11" lengthAdjust="spacing" textLength="128.1931" x="334.6774" y="666.9384">plain XFS / multi-disk ZFS</text><polygon fill="#EAF3F8" points="282.6652,780.3406,294.6652,792.3406,282.6652,804.3406,270.6652,792.3406,282.6652,780.3406" style="stroke:#569FC6;stroke-width:1;"/><rect fill="#FCF3E0" height="69.0323" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="219.5494" x="172.8905" y="824.3406"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="199.5494" x="182.8905" y="847.1687">Confirm &#8212; type the hostname back</text><text fill="#383939" font-family="Ubuntu" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="153.661" x="182.8905" y="863.5128">This is the point of no return:</text><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="135.325" x="182.8905" y="879.8569">the target disk is erased</text><rect fill="#FFFFFF" height="321.8208" rx="6" ry="6" style="stroke:#000000;stroke-width:1;" width="205.4332" x="179.9486" y="903.3729"/><path d="M360.3419,903.3729 L360.3419,915.4408 L350.3419,925.4408 L179.9486,925.4408" fill="none" style="stroke:#000000;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="170.3933" x="182.9486" y="919.3388">The installer does the rest</text><rect fill="#FCF3E0" height="52.6882" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="182.2652" x="191.5326" y="942.4408"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="162.2652" x="201.5326" y="965.2689">Partition and format the disk</text><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="37.0923" x="201.5326" y="981.613">(disko)</text><rect fill="#FCF3E0" height="52.6882" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="158.493" x="203.4187" y="1015.1291"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="93.4807" x="213.4187" y="1037.9571">Build the system</text><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="138.493" x="213.4187" y="1054.3013">and copy it onto the disk</text><rect fill="#FCF3E0" height="52.6882" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="138.4168" x="213.4568" y="1087.8173"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="118.4168" x="223.4568" y="1110.6454">Install NixOS and the</text><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="101.4367" x="223.4568" y="1126.9895">GRUB boot loader</text><rect fill="#FCF3E0" height="52.6882" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="185.4332" x="189.9486" y="1160.5055"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="165.4332" x="199.9486" y="1183.3336">Copy the machine's flake into</text><text fill="#383939" font-family="Ubuntu" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="78.1115" x="199.9486" y="1199.6777">/nixos-config</text><rect fill="#FCF3E0" height="36.3441" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="181.4012" x="191.9646" y="1245.1937"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="161.4012" x="201.9646" y="1268.0218">Reboot and remove the stick</text><rect fill="#FCF3E0" height="52.6882" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="207.2614" x="179.0345" y="1301.5379"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="160.4771" x="189.0345" y="1324.3659">A minimal working machine:</text><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="187.2614" x="189.0345" y="1340.7101">encrypted ZFS + COSMIC desktop</text><ellipse cx="282.6652" cy="1385.2261" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="282.6652" cy="1385.2261" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#569FC6;stroke-width:1;" x1="282.6652" x2="282.6652" y1="80.9641" y2="100.9641"/><polygon fill="#569FC6" points="278.6652,90.9641,282.6652,100.9641,286.6652,90.9641,282.6652,94.9641" style="stroke:#569FC6;stroke-width:1;"/><line style="stroke:#569FC6;stroke-width:1;" x1="282.6652" x2="282.6652" y1="137.3082" y2="157.3082"/><polygon fill="#569FC6" points="278.6652,147.3082,282.6652,157.3082,286.6652,147.3082,282.6652,151.3082" style="stroke:#569FC6;stroke-width:1;"/><line style="stroke:#569FC6;stroke-width:1;" x1="282.6652" x2="282.6652" y1="209.9964" y2="229.9964"/><polygon fill="#569FC6" points="278.6652,219.9964,282.6652,229.9964,286.6652,219.9964,282.6652,223.9964" style="stroke:#569FC6;stroke-width:1;"/><line style="stroke:#569FC6;stroke-width:1;" x1="282.6652" x2="282.66