<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="536px" preserveAspectRatio="none" style="width:562px;height:536px;background:#FFFFFF;" version="1.1" viewBox="0 0 562 536" width="562px" zoomAndPan="magnify"><?plantuml 1.2026.3?><defs/><g><g class="title" data-source-line="3"><text fill="#383939" font-family="Ubuntu" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="530.9937" x="15" y="38.5181">Your first login &#8212; reaching the gisnix commands</text></g><ellipse cx="164.572" cy="70.9641" fill="#569FC6" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><rect fill="#FCF3E0" height="36.3441" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="188.5052" x="70.3194" y="100.9641"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="168.5052" x="80.3194" y="123.7922">Log in to the COSMIC desktop</text><rect fill="#FCF3E0" height="36.3441" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="146.1329" x="91.5056" y="157.3082"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="126.1329" x="101.5056" y="180.1363">Open a terminal (kitty)</text><rect fill="#FCF3E0" height="52.6882" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="169.8091" x="79.6675" y="213.6523"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="149.8091" x="89.6675" y="236.4804">Go to your machine's flake</text><text fill="#383939" font-family="Ubuntu" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="95.1216" x="89.6675" y="252.8245">cd /nixos-config</text><rect fill="#FCF3E0" height="52.6882" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="102.5966" x="113.2737" y="286.3406"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="82.5966" x="123.2737" y="309.1686">Enter the tools</text><text fill="#383939" font-family="Ubuntu" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="68.4785" x="123.2737" y="325.5128">nix develop</text><rect fill="#FCF3E0" height="52.6882" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="176.6611" x="76.2415" y="359.0288"/><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="26.9402" x="86.2415" y="381.8569">Type</text><text fill="#383939" font-family="Ubuntu" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="35.3342" x="116.3017" y="381.8569">gisnix</text><text fill="#383939" font-family="Ubuntu" font-size="12" lengthAdjust="spacing" textLength="156.6611" x="86.2415" y="398.201">the command compendium</text><path d="M195.572,421.717 L195.572,466.9821 L175.572,470.9821 L195.572,474.9821 L195.572,520.2471 A0,0 0 0 0 195.572,520.2471 L487.6743,520.2471 A0,0 0 0 0 487.6743,520.2471 L487.6743,431.717 L477.6743,421.717 L195.572,421.717 A0,0 0 0 0 195.572,421.717" fill="#EAF3F8" style="stroke:#569FC6;stroke-width:1;"/><path d="M477.6743,421.717 L477.6743,431.717 L487.6743,431.717 L477.6743,421.717" fill="#EAF3F8" style="stroke:#569FC6;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="271.1022" x="201.572" y="440.614">From here everything is a `gisnix` command:</text><text fill="#383939" font-family="Ubuntu" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="104.0098" x="201.572" y="458.32">gisnix configure</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="119.8341" x="308.9619" y="458.32">to choose software,</text><text fill="#383939" font-family="Ubuntu" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="87.4381" x="201.572" y="476.0261">gisnix update</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="62.8551" x="292.3901" y="476.0261">to rebuild,</text><text fill="#383939" font-family="Ubuntu" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="79.5341" x="358.6252" y="476.0261">gisnix locale</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="267.4363" x="201.572" y="493.7321">to change your timezone, and so on. Typing</text><text fill="#383939" font-family="Ubuntu" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="38.2785" x="201.572" y="511.4381">gisnix</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="146.7442" x="243.2306" y="511.4381">on its own lists them all.</text><ellipse cx="164.572" cy="470.9821" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="164.572" cy="470.9821" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#569FC6;stroke-width:1;" x1="164.572" x2="164.572" y1="80.9641" y2="100.9641"/><polygon fill="#569FC6" points="160.572,90.9641,164.572,100.9641,168.572,90.9641,164.572,94.9641" style="stroke:#569FC6;stroke-width:1;"/><line style="stroke:#569FC6;stroke-width:1;" x1="164.572" x2="164.572" y1="137.3082" y2="157.3082"/><polygon fill="#569FC6" points="160.572,147.3082,164.572,157.3082,168.572,147.3082,164.572,151.3082" style="stroke:#569FC6;stroke-width:1;"/><line style="stroke:#569FC6;stroke-width:1;" x1="164.572" x2="164.572" y1="193.6523" y2="213.6523"/><polygon fill="#569FC6" points="160.572,203.6523,164.572,213.6523,168.572,203.6523,164.572,207.6523" style="stroke:#569FC6;stroke-width:1;"/><line style="stroke:#569FC6;stroke-width:1;" x1="164.572" x2="164.572" y1="266.3406" y2="286.3406"/><polygon fill="#569FC6" points="160.572,276.3406,164.572,286.3406,168.572,276.3406,164.572,280.3406" style="stroke:#569FC6;stroke-width:1;"/><line style="stroke:#569FC6;stroke-width:1;" x1="164.572" x2="164.572" y1="339.0288" y2="359.0288"/><polygon fill="#569FC6" points="160.572,349.0288,164.572,3