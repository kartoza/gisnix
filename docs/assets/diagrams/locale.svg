<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="494px" preserveAspectRatio="none" style="width:803px;height:494px;background:#FFFFFF;" version="1.1" viewBox="0 0 803 494" width="803px" zoomAndPan="magnify"><?plantuml 1.2026.3?><defs/><g><g class="title" data-source-line="3"><text fill="#383939" font-family="Ubuntu" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="654.9585" x="73.5008" y="38.5181">Locale &#8212; one preset, three parts you can move on their own</text></g><!--cluster preset--><g class="cluster" data-qualified-name="preset" data-source-line="5" id="ent0002"><rect fill="#EAF3F8" height="285.47" rx="6" ry="6" style="stroke:#8A8B8B;stroke-width:1;" width="450" x="339.96" y="195.0341"/><text fill="#383939" font-family="Ubuntu" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="80.7867" x="524.5666" y="212">Your preset</text><text fill="#383939" font-family="Ubuntu" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="161.8114" x="484.0543" y="231.068">e.g. Portugal &#8212; English</text></g><!--entity kb--><g class="entity" data-qualified-name="preset.kb" data-source-line="6" id="ent0003"><rect fill="#FCF3E0" height="49.0679" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="101.8378" x="356.04" y="261.5741"/><rect fill="#FCF3E0" height="10" style="stroke:#DF9E2F;stroke-width:1;" width="15" x="437.8778" y="266.5741"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="435.8778" y="268.5741"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="435.8778" y="272.5741"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="61.8378" x="371.04" y="296.54">keyboard</text></g><!--entity clock--><g class="entity" data-qualified-name="preset.clock" data-source-line="7" id="ent0004"><rect fill="#FCF3E0" height="68.1358" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="144.1876" x="629.87" y="252.0341"/><rect fill="#FCF3E0" height="10" style="stroke:#DF9E2F;stroke-width:1;" width="15" x="754.0576" y="257.0341"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="752.0576" y="259.0341"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="752.0576" y="263.0341"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="32.9979" x="644.87" y="287">clock</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="104.1876" x="644.87" y="306.068">(Europe/Lisbon)</text></g><!--entity lang--><g class="entity" data-qualified-name="preset.lang" data-source-line="8" id="ent0005"><rect fill="#FCF3E0" height="68.1358" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="101.7398" x="493.09" y="252.0341"/><rect fill="#FCF3E0" height="10" style="stroke:#DF9E2F;stroke-width:1;" width="15" x="574.8298" y="257.0341"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="572.8298" y="259.0341"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="572.8298" y="263.0341"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="61.7398" x="508.09" y="287">language</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="56.0278" x="508.09" y="306.068">(English)</text></g><!--entity fmt--><g class="entity" data-qualified-name="preset.fmt" data-source-line="9" id="ent0006"><rect fill="#FCF3E0" height="68.1358" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="231.1273" x="356.4" y="396.3641"/><rect fill="#FCF3E0" height="10" style="stroke:#DF9E2F;stroke-width:1;" width="15" x="567.5273" y="401.3641"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="565.5273" y="403.3641"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="565.5273" y="407.3641"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="70.9937" x="371.4" y="431.33">formatting</text><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="191.1273" x="371.4" y="450.398">(Portuguese numbers, dates)</text></g><!--entity travel--><g class="entity" data-qualified-name="travel" data-source-line="12" id="ent0007"><rect fill="#FCF3E0" height="49.0679" rx="6" ry="6" style="stroke:#DF9E2F;stroke-width:1;" width="166.7555" x="111.58" y="62.9641"/><rect fill="#FCF3E0" height="10" style="stroke:#DF9E2F;stroke-width:1;" width="15" x="258.3355" y="67.9641"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="256.3355" y="69.9641"/><rect fill="#FCF3E0" height="2" style="stroke:#DF9E2F;stroke-width:1;" width="4" x="256.3355" y="73.9641"/><text fill="#383939" font-family="Ubuntu" font-size="14" lengthAdjust="spacing" textLength="126.7555" x="126.58" y="97.93">Travelling to Zurich</text></g><g class="entity" data-qualified-name="GMN9" data-source-line="17" id="ent0010"><path d="M11,242.8341 L11,329.3642 A6,6 0 0 0 17,335.3642 L314.9253,335.3642 A6,6 0 0 0 320.9253,329.3642 L320.9253,246.8341 L310.9253,236.8341 L177.13,236.8341 L191.46,112.2141 L169.13,236.8341 L17,236.8341 A6,6 0 0 0 11,242.8341" fill="#EAF3F8" style="stroke:#569FC6;stroke-width:1;"/><path d="M310.9253,236.8341 L310.9253,243.8341 A3,3 0 0 0 313.9253,246.8341 L320.9253,246.8341 L310.9253,236.8341" fill="#EAF3F8" style="stroke:#569FC6;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="264.2382" x="17" y="255.7311">The preset sets all four together. When you</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="279.3702" x="17" y="273.4371">travel you can change one part &#8212; the clock &#8212;</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="227.2922" x="17" y="291.1431">and keep your language and number</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="288.9253" x="17" y="308.8492">formatting. Coming home is removing that one</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="234.7542" x="17" y="326.5552">override. `gisnix locale` does it for you.</text></g><!--link travel to clock--><g class="link" data-entity-1="ent0007" data-entity-2="ent0004" data-link-type="dependency" data-source-line="14" id="lnk8"><path d="M278.66,93.7941 C366.9,102.5441 507.35,125.7241 611.96,187.0341 C639.28,203.0441 659.5197,225.2118 675.7997,246.8218" fill="none" id="travel-to-clock" style="stroke:#569FC6;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#569FC6" points="679.41,251.6141,677.1894,242.0188,676.4014,247.6205,670.7997,246.8325,679.41,251.6141" style="stroke:#569FC6;stroke-width:1;"/><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="134.3681" x="592.84" y="156.9311">override just the clock</text><text fill="#383939" font-family="Ubuntu" font-size="13" lengthAdjust="spacing" textLength="94.9261" x="612.561" y="174.6371">(Europe/Zurich)</text></g><?plantuml-src NLB1YXGn4BtdAvwp5nUMLjYBU11acJdjmSE2A0jkkhkcEqwIQfBAwYA27-4N-YLMEZFgU6YQfDwhL_LUdhau-38IFibCWRgb16-CEF64Mnwi_dxz-0cEX2LH9hc2p8dqP9DaF771O2C2FvA2j4OkWRz4On8DOkEa3JOVkAGZ_JvIDtLunqdAPFtQVAieb-SDR3wYSB5zkxlUlS8t0mmS5jMFWis1ddgsQLoXX_wyE7WU3lVn-ROaNkZ5hSiznyiLkfREqLvdAtQYIcZw3Lhlpv5xJi6Ak3WfjWrUT4Z44dfA-GgZ5SgDlGzYlXlp3_iksKVoNjaGniUItD0sbRM0YztDxdhxKZrlvwvxqyR5QwYfAJaDvtF9Kht5VpksTfV6H1P2po8STFYx-PGMzCkmtcDVCn2UIDka3kzdYZKzHH-5Jr4Eipf0BN7DU4teZtGzASN64GUYfP8IJbQkryqLnVorhSCDXsh0p87WCXBfUraTcQrK9OMVTktmCBaStLVuzVazO6JAS58RLhtEK9NHXNy3?></g></svg>