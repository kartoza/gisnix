# Theming mirrors kartoza/InfrastructureMapper for visual consistency
# across Kartoza-maintained mkdocs sites. Design tokens live in
# docs/stylesheets/kartoza-tokens.css; Material adapter is in extra.css.
site_name: gisnix
site_description: A reproducible NixOS distribution for GIS workstations — ZFS-encryption-ready, bundle-based software selection, Kartoza-branded installer.
site_url: https://kartoza.github.io/gisnix/
site_author: Kartoza

copyright: >
  &copy; Kartoza — Made with 💗 by
  <a href="https://kartoza.com">Kartoza</a>
  &middot; <a href="https://github.com/sponsors/timlinux">Donate</a>
  &middot; <a href="https://github.com/kartoza/gisnix">GitHub</a>

repo_url: https://github.com/kartoza/gisnix
repo_name: kartoza/gisnix
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/brand/kartoza-symbol-color.svg
  favicon: assets/brand/kartoza-symbol-color.svg
  font:
    text: Lato
    code: JetBrains Mono
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    edit: material/file-edit-outline
    view: material/eye-outline

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kartoza/gisnix
      name: GitHub repository
    - icon: fontawesome/solid/globe
      link: https://kartoza.com
      name: Kartoza
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/timlinux
      name: Sponsor on GitHub
  generator: false

extra_css:
  - stylesheets/kartoza-tokens.css
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds: {case: lower}
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      lang: en
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - no-lightbox
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true
      strict: false

nav:
  - Home: index.md
  - User guide:
      - user/index.md
      - Quickstart: user/quickstart.md
      - Building your fleet: user/fleet.md
      - Keyboard remapping: user/keyboard.md
  - Administration:
      - admin/index.md
      - Software bundles: admin/software-bundles.md
      - Storage modes: admin/storage-modes.md
  - Developer guide:
      - developer/index.md
      - Architecture: developer/architecture.md
      - Adding a host: developer/adding-a-host.md
      - The installer: developer/installer.md
      - Building on gisnix (lib.mkHost): developer/downstream-flakes.md
  - References:
      - references/index.md
      - Operator commands: references/commands.md
      - Software bundles: references/bundles.md
